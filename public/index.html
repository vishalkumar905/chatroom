<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<meta name="theme-color" content="#667aff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="ChatCord" />
		<link rel="manifest" href="manifest.json" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
		<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
			integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk="
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="css/style.css" />
		<title>ChatCord App</title>
	</head>
	<body>
		<div class="join-container">
			<header class="join-header">
				<h1><i class="fas fa-smile"></i> ChatCord</h1>
			</header>
			<main class="join-main">
				<div id="error-banner" class="alert-error hidden"></div>
				<form id="join-form" action="chat.html">
					<div class="form-control">
						<label for="username">Username</label>
						<input
							type="text"
							name="username"
							id="username"
							placeholder="Enter username..."
							required
							autofocus
							autocomplete="off"
						/>
					</div>
					<div class="form-control">
						<label for="room">Room (select or type custom room)</label>
						<input
							type="text"
							name="room"
							id="room"
							list="room-suggestions"
							placeholder="e.g. JavaScript, Design, Hangout..."
							required
							autocomplete="off"
						/>
						<datalist id="room-suggestions">
							<option value="JavaScript"></option>
							<option value="Python"></option>
							<option value="General"></option>
							<option value="Design"></option>
							<option value="PHP"></option>
							<option value="Java"></option>
						</datalist>
					</div>
					<div class="form-control">
						<label for="passcode">
							<i class="fas fa-key"></i> Room Passcode / PIN 
							<span class="label-badge">Optional</span>
						</label>
						<div class="password-wrapper">
							<input
								type="password"
								name="passcode"
								id="passcode"
								placeholder="Enter passcode..."
								autocomplete="off"
							/>
							<button type="button" id="toggle-pwd-btn" class="toggle-pwd-btn" title="Show/Hide Passcode">
								<i class="far fa-eye"></i>
							</button>
						</div>
						<small class="form-hint">Locks the room while active. Leave empty for open access.</small>
					</div>
					<button type="submit" class="btn">Join Chat</button>
				</form>
				<div id="pwa-install-banner" class="pwa-install-banner hidden">
					<div class="pwa-install-banner-content">
						<img src="icons/icon-192x192.png" alt="ChatCord" class="pwa-install-icon" />
						<div class="pwa-install-text">
							<h4>Install ChatCord</h4>
							<p>Fast fullscreen chat on your device</p>
						</div>
					</div>
					<button type="button" class="pwa-install-action-btn pwa-install-btn">
						<i class="fas fa-download"></i> Install
					</button>
				</div>
			</main>
		</div>

		<script>
			// Check URL parameters for errors or prefilled room
			const params = new URLSearchParams(window.location.search);
			const error = params.get('error');
			const room = params.get('room');

			if (room) {
				const roomInput = document.getElementById('room');
				if (roomInput) roomInput.value = room;
				const pwd = document.getElementById('passcode');
				if (pwd) pwd.focus();
			}

			if (error) {
				const banner = document.getElementById('error-banner');
				if (banner) {
					banner.textContent = error;
					banner.classList.remove('hidden');
				}
			}

			// Toggle password visibility
			const pwdInput = document.getElementById('passcode');
			const toggleBtn = document.getElementById('toggle-pwd-btn');
			if (toggleBtn && pwdInput) {
				toggleBtn.addEventListener('click', () => {
					const isPwd = pwdInput.type === 'password';
					pwdInput.type = isPwd ? 'text' : 'password';
					toggleBtn.innerHTML = isPwd ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
				});
			}

			// Submit without exposing passcode in the browser URL
			const joinForm = document.getElementById('join-form');
			if (joinForm) {
				joinForm.addEventListener('submit', (e) => {
					e.preventDefault();
					const username = document.getElementById('username').value.trim();
					const room = document.getElementById('room').value.trim();
					const passcode = document.getElementById('passcode').value.trim();

					if (passcode) {
						sessionStorage.setItem('ephemeral_room_passcode', passcode);
					} else {
						sessionStorage.removeItem('ephemeral_room_passcode');
					}

					// Navigate cleanly without passcode in query string
					window.location.href = `chat.html?username=${encodeURIComponent(username)}&room=${encodeURIComponent(room)}`;
				});
			}
		</script>
		<script src="js/pwa.js"></script>
	</body>
</html>
